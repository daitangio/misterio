# Configuration based on tutorial at 
# https://packaging.python.org/en/latest/tutorials/packaging-projects/
[project]
name = "misterio"
version = "0.1.7a1"
description = "misterio CLI"
authors = [
  { name="Giovanni Giorgi", email="jj@gioorgi.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[projects.urls]
Homepage = "https://github.com/daitangio/misterio"
Issues = "https://github.com/daitangio/misterio/issues"

[project.scripts]
misterio = "misterio.misterio:misterio"
misterio-mv = "misterio.misterio_util:misterio_mv"
misterio-rm = "misterio.misterio_util:misterio_rm"
misterio-add = "misterio.misterio_util:misterio_add"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "black>=26.10.1"
]
publish_misterio=[
    "build==1.6.1",
    "twine==7.0.0",
]
ai_support = [
    "mistral-vibe>=3.0.4",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=misterio",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["src/misterio"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[build-system]
# Flit Core is a lightweight tool designed to simplify the process of packaging and distributing Python projects
# following PEP 517
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"
